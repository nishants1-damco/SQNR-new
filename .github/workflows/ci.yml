name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      # The Azure templates compile and pass the Bicep linter.
      - run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/app.Dockerfile --build-arg APP=api -t spatial-api:ci .
      - run: docker build -f infra/docker/app.Dockerfile --build-arg APP=worker -t spatial-worker:ci .

  integration:
    name: Local stack + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm infra:up
      - run: pnpm infra:check
      # Migrations against the development database, as a developer would run them.
      - run: pnpm db:migrate
      # Throwaway databases, real Redis, Azurite and Mailpit; a scripted model
      # stands in for Claude.
      - run: pnpm test:integration
      # Scores the fixtures and replays recorded captures through the pipeline
      # (no model calls, no API key). Live runs are manual: pnpm eval --provider claude.
      - run: pnpm eval
      - name: Service logs
        if: failure()
        run: pnpm infra:logs
      - name: Tear down
        if: always()
        run: pnpm infra:reset

; Local PgBouncer in transaction mode, matching production (plan §8.4).
[databases]
spatial = host=postgres port=5432 dbname=spatial
; Any other database name passes through, so throwaway test databases
; (created by @spatial/db's test helper) are also reached through the pooler.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
; Protocol-level prepared statements work in transaction mode (PgBouncer >= 1.21).
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits,options
